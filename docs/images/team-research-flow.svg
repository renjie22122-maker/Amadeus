<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
<title id="title">团队组织与证据核对 / Team organization and evidence review</title><desc id="desc">Choose independent delegation or an open team. Open teams route topic-specific messages; evidence is attributed and checked before synthesis. Groups share permissions and budgets.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1040" height="600" rx="20" fill="#f8fafc"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#0f172a"><text x="40" y="46" font-size="25" font-weight="700">团队组织与证据核对</text><text x="40" y="74" font-size="16" fill="#475569">Task-based collaboration · attributable evidence · explicit limits</text>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M265 161 H355"/><path d="M265 161 V280 H355"/><path d="M640 275 H700 V147 H750"/><path d="M700 275 H750"/><path d="M700 275 V403 H750"/><path d="M875 445 V490 H690"/><path d="M390 445 H420 V350 H480 V325"/></g>
<rect x="40" y="115" width="225" height="94" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="60" y="151" font-size="20" font-weight="600">按任务选择组织方式</text><text x="60" y="181" font-size="15">Choose the simplest structure</text>
<rect x="355" y="110" width="285" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="375" y="145" font-size="17" font-weight="600">普通子任务 / Independent tasks</text><text x="375" y="178" font-size="15">Bounded work → report to lead</text>
<rect x="355" y="230" width="285" height="95" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="375" y="267" font-size="20" font-weight="600">开放团队 / Open roster</text><text x="375" y="298" font-size="15">Configure → spawn / continue → enroll</text>
<g fill="#fff" stroke="#93c5fd"><rect x="750" y="105" width="245" height="84" rx="12"/><rect x="750" y="233" width="245" height="84" rx="12"/><rect x="750" y="361" width="245" height="84" rx="12"/></g>
<text x="770" y="139" font-size="19">议题 A / Topic A</text><text x="770" y="169" font-size="14">Investigator · challenger · reviewer</text><text x="770" y="267" font-size="19">议题 B / Topic B</text><text x="770" y="297" font-size="14">Addressed messages, not votes</text><text x="770" y="395" font-size="19">议题 C / Topic C</text><text x="770" y="425" font-size="14">Shared budgets and permissions</text>
<rect x="40" y="400" width="350" height="126" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="60" y="434" font-size="19" font-weight="600">名单锁定 ≠ 必须放弃协作</text><text x="60" y="465" font-size="15">inspect → update_team_roster → retry</text><text x="60" y="495" font-size="14">Revision checked · retain history and roles</text>
<rect x="440" y="455" width="250" height="80" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="460" y="486" font-size="18" font-weight="600">来源 → 判断 → 综合</text><text x="460" y="515" font-size="14">Attribute · compare editions · qualify</text>
<text x="40" y="573" font-size="15" fill="#475569">同一来源不因多人引用而变成独立证据。One source quoted by many agents is still one source.</text>
</g></svg>