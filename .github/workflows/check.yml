name: checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/retrieval_service.py scripts/prepare_retrieval_models.py
      - run: python tests/local-voice.test.py
      - run: python tests/model-preparation.test.py
      - run: python tests/retrieval-batch.test.py
      - run: python evals/public-qa/test_native_rpc.py
      - run: python evals/full-suite/test_attempt_state.py
      - run: pnpm check:docs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/smoke-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-app-${{ matrix.os }}
          path: |
            build/
            dist/
