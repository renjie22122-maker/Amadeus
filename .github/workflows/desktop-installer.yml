name: Windows desktop installer
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:desktop
      - run: pnpm test:desktop:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Amadeus-Windows-x64-installer
          path: release/Amadeus-Setup-*.exe
